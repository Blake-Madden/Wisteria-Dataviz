<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   viewBox="0 0 24 24"
   width="24"
   height="24">
  <!-- three KPI rows: qualitative range bands (light to dark), an actual-value
       bar tinted green when it meets its target tick or red when it falls short -->
  <g>
    <rect x="1" y="3" width="8" height="4" fill="#cfcfcf" />
    <rect x="9" y="3" width="7" height="4" fill="#999999" />
    <rect x="16" y="3" width="7" height="4" fill="#666666" />
    <rect x="1" y="4" width="14" height="2" rx="0.4" fill="#4cbb17" />
    <line x1="12" y1="2" x2="12" y2="8" stroke="#e8a33d" stroke-width="1.2" stroke-linecap="round" />
  </g>
  <g>
    <rect x="1" y="10" width="8" height="4" fill="#cfcfcf" />
    <rect x="9" y="10" width="7" height="4" fill="#999999" />
    <rect x="16" y="10" width="7" height="4" fill="#666666" />
    <rect x="1" y="11" width="9" height="2" rx="0.4" fill="#ce2029" />
    <line x1="15" y1="9" x2="15" y2="15" stroke="#e8a33d" stroke-width="1.2" stroke-linecap="round" />
  </g>
  <g>
    <rect x="1" y="17" width="8" height="4" fill="#cfcfcf" />
    <rect x="9" y="17" width="7" height="4" fill="#999999" />
    <rect x="16" y="17" width="7" height="4" fill="#666666" />
    <rect x="1" y="18" width="17" height="2" rx="0.4" fill="#4cbb17" />
    <line x1="16" y1="16" x2="16" y2="22" stroke="#e8a33d" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
