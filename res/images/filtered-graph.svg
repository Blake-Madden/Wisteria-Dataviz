<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5b9bd5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3a7bbf;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ed7d31;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d06420;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#70ad47;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#548c34;stop-opacity:1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Back chart (top left) -->
  <g transform="translate(14,14)" filter="url(#dropShadow)" opacity="0.55">
    <rect x="0" y="0" width="150" height="120" rx="8" ry="8" fill="#ffffff" stroke="#808080" stroke-width="3"/>
    <rect x="22" y="58" width="26" height="42" rx="2" fill="url(#bar1Grad)"/>
    <rect x="62" y="30" width="26" height="70" rx="2" fill="url(#bar2Grad)"/>
    <rect x="102" y="46" width="26" height="54" rx="2" fill="url(#bar3Grad)"/>
    <rect x="14" y="100" width="122" height="3" fill="#808080"/>
  </g>

  <!-- Middle chart -->
  <g transform="translate(52,57)" filter="url(#dropShadow)" opacity="0.8">
    <rect x="0" y="0" width="150" height="120" rx="8" ry="8" fill="#ffffff" stroke="#808080" stroke-width="3"/>
    <rect x="22" y="36" width="26" height="64" rx="2" fill="url(#bar1Grad)"/>
    <rect x="62" y="62" width="26" height="38" rx="2" fill="url(#bar2Grad)"/>
    <rect x="102" y="24" width="26" height="76" rx="2" fill="url(#bar3Grad)"/>
    <rect x="14" y="100" width="122" height="3" fill="#808080"/>
  </g>

  <!-- Front chart (bottom right) -->
  <g transform="translate(90,100)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="150" height="120" rx="8" ry="8" fill="#ffffff" stroke="#808080" stroke-width="3"/>
    <rect x="22" y="50" width="26" height="50" rx="2" fill="url(#bar1Grad)"/>
    <rect x="62" y="20" width="26" height="80" rx="2" fill="url(#bar2Grad)"/>
    <rect x="102" y="64" width="26" height="36" rx="2" fill="url(#bar3Grad)"/>
    <!-- Bar highlights -->
    <rect x="24" y="52" width="6" height="46" rx="2" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="64" y="22" width="6" height="76" rx="2" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="104" y="66" width="6" height="32" rx="2" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="14" y="100" width="122" height="3" fill="#808080"/>
  </g>
</svg>
