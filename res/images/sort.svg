     fill="#2E86DE"
     id="rect-arrow-shaft" />
  <path
     d="M 64,232 36,192 92,192 Z"
     fill="#2E86DE"
     id="path-arrow-down" />
  <!-- List bars, shortest to longest -->
  <rect
     x="112"
     y="54"
     width="60"
     height="28"
     rx="6"
