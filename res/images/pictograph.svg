<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   viewBox="0 0 64 64"
   width="64"
   height="64">
  <!-- Pictograph: two tied money bags, where each one's area is proportional to its value -->
  <defs>
    <linearGradient id="bagFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c89e6e" />
      <stop offset="1" stop-color="#8b5b36" />
    </linearGradient>
  </defs>
  <g stroke="#5c3c22" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
    <!-- small bag -->
    <path
       d="M 29,10.5 C 29.5,7.5 30.5,7.5 30,4.5 L 34,4.5 C 33.5,7.5 34.5,7.5 35,10.5 Z"
       fill="#8b5b36" />
    <path d="M 30,4.5 L 28.5,2 M 34,4.5 L 35.5,2.5" fill="none" />
    <path
       d="M 18,18 C 18,11.625 21.5,9.5 32,9.5 C 42.5,9.5 46,11.625 46,18 C 46,24.375 42.5,26.5 32,26.5 C 21.5,26.5 18,24.375 18,18 Z"
       fill="url(#bagFill)" />
    <path d="M 30.3,7 H 33.7" fill="none" />
    <!-- large bag -->
    <path
       d="M 28.5,36 C 29,33 30,33 29.5,30.5 L 34.5,30.5 C 34,33 35,33 35.5,36 Z"
       fill="#8b5b36" />
    <path d="M 29.5,30.5 L 27.5,28 M 34.5,30.5 L 36.5,28.5" fill="none" />
    <path
       d="M 6,47.5 C 6,37.75 12.5,34.5 32,34.5 C 51.5,34.5 58,37.75 58,47.5 C 58,57.25 51.5,60.5 32,60.5 C 12.5,60.5 6,57.25 6,47.5 Z"
       fill="url(#bagFill)" />
    <path d="M 30,33 H 34" fill="none" />
  </g>
</svg>
