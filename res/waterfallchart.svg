<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   viewBox="0 0 24 24"
   width="24"
   height="24">
  <!-- waterfall steps: steel-blue totals from the baseline, a green increase
       floating off the first total, a red decrease hanging from that peak,
       and a green step rising again. Mid-tone fills with no background so the
       icon reads on both dark and light themes. -->
  <rect x="2" y="10" width="3" height="10" rx="0.5" fill="#89cff0" />
  <rect x="5.8" y="6" width="3" height="4" rx="0.5" fill="#50c878" />
  <rect x="9.6" y="6" width="3" height="6" rx="0.5" fill="#f28500" />
  <rect x="13.4" y="12" width="3" height="8" rx="0.5" fill="#89cff0" />
  <rect x="17.2" y="9" width="3" height="3" rx="0.5" fill="#50c878" />
  <line x1="1" y1="21" x2="23" y2="21" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round" />
</svg>
