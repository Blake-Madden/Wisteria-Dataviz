<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   version="1.1"
   width="100"
   height="100"
   viewBox="0 0 100 100">
  <title>Aggressive serpentine bar chart</title>
  <!-- a folded bar whose second run shares a row with a shorter bar,
       taking the space trailing it rather than a row of its own -->
  <g fill="#52c5ff" stroke="#000000" stroke-width="2">
    <rect x="8" y="24" width="26" height="12" />
    <rect x="8" y="44" width="54" height="12" />
    <rect x="8" y="64" width="36" height="12" />
  </g>
  <g fill="none" stroke-linejoin="round" stroke-linecap="butt">
    <path
       d="M 8,10 L 92,10 L 92,30 L 52,30"
       stroke="#000000"
       stroke-width="14" />
    <path
       d="M 8,10 L 92,10 L 92,30 L 52,30"
       stroke="#52c5ff"
       stroke-width="10" />
  </g>
</svg>
