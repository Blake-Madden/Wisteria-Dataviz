<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   version="1.1"
   width="100"
   height="100"
   viewBox="0 0 100 100">
  <title>Serpentine bar chart</title>
  <!-- two ordinary bars, then one bar folded through the rows beneath it -->
  <g fill="#52c5ff" stroke="#000000" stroke-width="2">
    <rect x="8" y="4" width="32" height="12" />
    <rect x="8" y="24" width="24" height="12" />
  </g>
  <g fill="none" stroke-linejoin="round" stroke-linecap="butt">
    <path
       d="M 8,50 L 92,50 L 92,70 L 8,70 L 8,90 L 58,90"
       stroke="#000000"
       stroke-width="14" />
    <path
       d="M 8,50 L 92,50 L 92,70 L 8,70 L 8,90 L 58,90"
       stroke="#52c5ff"
       stroke-width="10" />
  </g>
</svg>
